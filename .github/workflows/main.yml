name: Automated ML Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Execute End-to-End ML Pipeline
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./MLproject

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mlflow optuna xgboost scikit-learn pandas numpy

      - name: Data Preprocessing
        run: python "preprocessing/automate_M Rishawan.py"

      - name: Model Training & Evaluation
        run: mlflow run . --env-manager=local --experiment-name="Housing_Price"

      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Trained-Model-and-Metrics
          path: MLproject/mlruns/
          retention-days: 14
